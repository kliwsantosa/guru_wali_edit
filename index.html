<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan Guru Wali - Puzzle Kebersamaan</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe',
                            300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6',
                            600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        /* Hide scrollbar for clean UI but allow scrolling */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // =====================================================================
        // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI BAWAH INI:
        // Jangan lupa pastikan URL tetap berada di dalam tanda kutip!
        // =====================================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxOsbpp6TTh1gOl9OTIWTMxBPhheAMK7pva8V84V2fIiAIkskDSAzkdNUPbX2ZIvqmg/exec"; 
        
        // Memeriksa apakah URL valid dari Google Script
        const isOnline = GOOGLE_SCRIPT_URL.startsWith("https://script.google.com/");

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-2xl shadow-sm border border-slate-100 p-6 ${className}`}>
                {children}
            </div>
        );

        const Button = ({ children, onClick, variant = "primary", className = "", icon, type = "button", disabled=false }) => {
            const baseStyle = "px-4 py-2 rounded-xl font-medium transition-all duration-200 flex items-center justify-center gap-2";
            const variants = {
                primary: "bg-brand-600 text-white hover:bg-brand-700 shadow-sm disabled:opacity-50",
                secondary: "bg-brand-50 text-brand-700 hover:bg-brand-100 disabled:opacity-50",
                outline: "border-2 border-brand-200 text-brand-700 hover:bg-brand-50 disabled:opacity-50"
            };
            return (
                <button type={type} onClick={onClick} disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`}>
                    {icon && <i className={icon}></i>}
                    {children}
                </button>
            );
        };

        const SectionHeader = ({ title, subtitle, icon }) => (
            <div className="mb-6">
                <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-3">
                    {icon && <span className="bg-brand-100 text-brand-600 p-2 rounded-lg text-lg"><i className={icon}></i></span>}
                    {title}
                </h2>
                {subtitle && <p className="text-slate-500 mt-2">{subtitle}</p>}
            </div>
        );

        const Toast = ({ message, type = "success", onClose }) => {
            useEffect(() => {
                const timer = setTimeout(() => onClose(), 4000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const icons = {
                success: "fa-check-circle text-green-500",
                error: "fa-exclamation-circle text-red-500",
                info: "fa-info-circle text-brand-500"
            };

            return (
                <div className="fixed bottom-4 right-4 bg-white border border-slate-100 shadow-lg rounded-xl p-4 flex items-center gap-3 z-[100] animate-bounce max-w-sm">
                    <i className={`fas ${icons[type]} text-2xl flex-shrink-0`}></i>
                    <p className="text-slate-700 font-medium text-sm">{message}</p>
                    <button onClick={onClose} className="text-slate-400 hover:text-slate-600 ml-2">
                        <i className="fas fa-times"></i>
                    </button>
                </div>
            );
        };

        const Overview = () => (
            <div className="space-y-6">
                <Card className="bg-gradient-to-br from-brand-600 to-brand-800 text-white border-none relative overflow-hidden">
                    <div className="absolute top-0 right-0 opacity-10 transform translate-x-1/4 -translate-y-1/4">
                        <i className="fas fa-puzzle-piece text-9xl"></i>
                    </div>
                    <div className="relative z-10">
                        <span className="bg-white/20 px-3 py-1 rounded-full text-sm font-medium backdrop-blur-sm">SMAN 1 Sleman | Pertemuan bersama 18 murid</span>
                        <h1 className="text-3xl md:text-4xl font-bold mt-4 mb-2">Merangkai Puzzle Kebersamaan</h1>
                        <p className="text-brand-100 text-lg">Di Kelas Kita</p>
                        
                        <div className="mt-8 bg-white/10 p-4 rounded-xl backdrop-blur-sm border border-white/20">
                            <h3 className="font-semibold text-brand-50 mb-1 flex items-center gap-2">
                                <i className="fas fa-lightbulb"></i> Gagasan Utama
                            </h3>
                            <p className="text-sm md:text-base text-brand-50/90 leading-relaxed">
                                "Kita datang dari kelas pilihan yang berbeda, membawa cerita dan keunikan masing-masing. Ketika kita saling mengenal, menghargai, dan melengkapi, kita dapat membangun kelompok yang utuh dan bermakna."
                            </p>
                        </div>
                    </div>
                </Card>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <Card>
                        <SectionHeader title="Tujuan Pertemuan" icon="fas fa-bullseye" />
                        <ul className="space-y-3">
                            {[
                                "Murid mengenal guru wali dan memahami peran guru wali sebagai pendamping.",
                                "Murid mulai mengenal nama, minat, keunikan, dan harapan teman-temannya.",
                                "Murid memahami bahwa setiap orang memiliki nilai dan kontribusi, meskipun berbeda.",
                                "Murid menyampaikan harapan tentang suasana kelompok yang nyaman dan saling mendukung.",
                                "Murid menyepakati beberapa kebiasaan sederhana untuk membangun kebersamaan."
                            ].map((item, idx) => (
                                <li key={idx} className="flex gap-3 text-slate-700">
                                    <i className="fas fa-check text-brand-500 mt-1"></i>
                                    <span>{item}</span>
                                </li>
                            ))}
                        </ul>
                    </Card>

                    <Card>
                        <SectionHeader title="Alur Kegiatan (3 Pertemuan @ 45 Menit)" icon="fas fa-clock" />
                        <div className="space-y-6">
                            {/* Pertemuan 1 */}
                            <div>
                                <h3 className="font-bold text-brand-600 border-b border-brand-100 pb-2 mb-3">Pertemuan 1 (45 Menit)</h3>
                                <div className="relative border-l-2 border-brand-100 ml-3 space-y-4">
                                    {[
                                        { t: "15 menit", n: "Pembukaan & pengantar", d: "Membangun rasa aman & mengenalkan tujuan." },
                                        { t: "30 menit", n: "Aku & satu keping unikku", d: "Perkenalan ringan seluruh murid." }
                                    ].map((step, idx) => (
                                        <div key={idx} className="pl-6 relative">
                                            <div className="absolute w-3 h-3 bg-brand-500 rounded-full -left-[7px] top-1.5 ring-4 ring-brand-50"></div>
                                            <span className="text-xs font-bold text-brand-600 bg-brand-50 px-2 py-1 rounded-md">{step.t}</span>
                                            <h4 className="font-semibold text-slate-800 mt-1">{step.n}</h4>
                                            <p className="text-sm text-slate-500">{step.d}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            
                            {/* Pertemuan 2 */}
                            <div>
                                <h3 className="font-bold text-brand-600 border-b border-brand-100 pb-2 mb-3 mt-2">Pertemuan 2 (45 Menit)</h3>
                                <div className="relative border-l-2 border-brand-100 ml-3 space-y-4">
                                    {[
                                        { t: "15 menit", n: "Makna puzzle kebersamaan", d: "Menghubungkan metafora puzzle." },
                                        { t: "30 menit", n: "Aktivitas merangkai puzzle", d: "Menuliskan keunikan, kontribusi, & harapan." }
                                    ].map((step, idx) => (
                                        <div key={idx} className="pl-6 relative">
                                            <div className="absolute w-3 h-3 bg-brand-500 rounded-full -left-[7px] top-1.5 ring-4 ring-brand-50"></div>
                                            <span className="text-xs font-bold text-brand-600 bg-brand-50 px-2 py-1 rounded-md">{step.t}</span>
                                            <h4 className="font-semibold text-slate-800 mt-1">{step.n}</h4>
                                            <p className="text-sm text-slate-500">{step.d}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Pertemuan 3 */}
                            <div>
                                <h3 className="font-bold text-brand-600 border-b border-brand-100 pb-2 mb-3 mt-2">Pertemuan 3 (45 Menit)</h3>
                                <div className="relative border-l-2 border-brand-100 ml-3 space-y-4">
                                    {[
                                        { t: "30 menit", n: "Suara dari setiap keping", d: "Menggali harapan & dukungan yang dibutuhkan." },
                                        { t: "15 menit", n: "Kesepakatan & penutup", d: "Menentukan tindakan kecil & refleksi." }
                                    ].map((step, idx) => (
                                        <div key={idx} className="pl-6 relative">
                                            <div className="absolute w-3 h-3 bg-brand-500 rounded-full -left-[7px] top-1.5 ring-4 ring-brand-50"></div>
                                            <span className="text-xs font-bold text-brand-600 bg-brand-50 px-2 py-1 rounded-md">{step.t}</span>
                                            <h4 className="font-semibold text-slate-800 mt-1">{step.n}</h4>
                                            <p className="text-sm text-slate-500">{step.d}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </Card>
                </div>
            </div>
        );

        const Materi = () => (
            <div className="space-y-6">
                <Card>
                    <SectionHeader title="Materi Inti" subtitle="Pesan-pesan utama yang perlu disampaikan kepada murid." icon="fas fa-book-open" />
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                        {[
                            { title: "1. Kita Berbeda, dan Itu Tidak Apa-apa", desc: "Setiap murid datang dengan pengalaman, kebiasaan, minat, kemampuan, dan cara berpikir yang berbeda.", msg: "Kita tidak harus sama untuk bisa bersama.", icon: "fa-users" },
                            { title: "2. Setiap Murid adalah Kepingan Penting", desc: "Dalam puzzle, kepingan memiliki bentuk dan posisi masing-masing. Begitu juga dalam kelompok.", msg: "Tidak harus menjadi yang paling menonjol untuk menjadi berarti.", icon: "fa-puzzle-piece" },
                            { title: "3. Kebersamaan Tidak Berarti Selalu Sepakat", desc: "Kelompok yang sehat dapat mendengarkan, memperbaiki kesalahan, dan mencari jalan keluar bersama.", msg: "Kita boleh berbeda pendapat tanpa merendahkan orang lain.", icon: "fa-comments" },
                            { title: "4. Rasa Aman Dibangun Bersama", desc: "Setiap murid perlu merasa cukup aman untuk menjadi diri sendiri. Hindari ejekan atau label negatif.", msg: "Jadilah teman yang membuat orang lain merasa diterima.", icon: "fa-shield-heart" }
                        ].map((materi, idx) => (
                            <div key={idx} className="p-5 rounded-xl border border-slate-100 bg-slate-50 hover:border-brand-300 transition-colors">
                                <div className="text-brand-500 mb-3 text-2xl"><i className={`fas ${materi.icon}`}></i></div>
                                <h3 className="font-bold text-slate-800 mb-2">{materi.title}</h3>
                                <p className="text-sm text-slate-600 mb-3">{materi.desc}</p>
                                <div className="bg-white p-3 rounded-lg text-sm border-l-4 border-brand-500 shadow-sm font-medium text-brand-800">
                                    <i className="fas fa-key mr-2 text-brand-400"></i> {materi.msg}
                                </div>
                            </div>
                        ))}
                    </div>
                </Card>
            </div>
        );

        const Aktivitas = () => (
            <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <Card>
                        <SectionHeader title="Aktivitas 1: Aku & Satu Keping Unikku" icon="fas fa-user-tag" />
                        <p className="text-sm text-slate-600 mb-4">Setiap murid memperkenalkan diri selama sekitar 40–45 detik. Sampaikan:</p>
                        <ul className="space-y-2 mb-6">
                            {['Nama panggilan yang ingin digunakan', 'Kelas pilihan', 'Satu hal yang disukai', 'Satu keunikan atau hal yang ingin dikembangkan'].map((li, i) => (
                                <li key={i} className="flex gap-2 text-sm text-slate-700 items-start">
                                    <i className="fas fa-caret-right text-brand-500 mt-0.5"></i> {li}
                                </li>
                            ))}
                        </ul>
                    </Card>

                    <Card>
                        <SectionHeader title="Aktivitas 2: Merangkai Puzzle" icon="fas fa-puzzle-piece" />
                        <p className="text-sm text-slate-600 mb-3">Pada kepingan masing-masing, tuliskan:</p>
                        <div className="space-y-3">
                            {[
                                {label: "Nama saya", desc: "panggilan yang ingin dikenal"},
                                {label: "Keunikan saya", desc: "satu hal yang disukai / kekuatan"},
                                {label: "Kontribusi saya", desc: "satu hal yang bisa diberikan"},
                                {label: "Harapan saya", desc: "satu hal yang ingin dirasakan bersama"}
                            ].map((item, i) => (
                                <div key={i} className="bg-brand-50 p-3 rounded-lg flex items-center gap-3">
                                    <div className="bg-brand-600 text-white text-xs px-2 py-1 rounded shadow-sm w-28 text-center font-semibold">{item.label}</div>
                                    <span className="text-sm text-slate-600 flex-1">{item.desc}</span>
                                </div>
                            ))}
                        </div>
                    </Card>
                </div>
            </div>
        );

        const LembarKerja = ({ setToast, setLocalSubmissions }) => {
            const [formData, setFormData] = useState({
                namaLengkap: '', tanggal: '', nama: '', kelas: '', kata1: '', kata2: '', kata3: '',
                suka: '', kekuatan: '', nyaman: '', harapan: '', tindakan: '', opsional: ''
            });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const handleChange = (e) => setFormData({...formData, [e.target.name]: e.target.value});

            const handleSubmit = async (e) => {
                e.preventDefault();
                if(!formData.namaLengkap || !formData.tanggal || !formData.nama || !formData.kelas) {
                    setToast({ message: "Nama Lengkap, Tanggal, Nama Panggilan, dan Kelas wajib diisi!", type: "error" });
                    return;
                }

                setIsSubmitting(true);
                try {
                    if (isOnline) {
                        // Kirim ke Google Sheets dengan mode no-cors untuk bypass pembatasan browser (POST)
                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(formData)
                        });
                        setToast({ message: "Data berhasil disimpan ke Server / Google Sheets!", type: "success" });
                    } else {
                        // Simulasi jika belum diisi URL-nya
                        const newEntry = { ...formData, id: Date.now().toString(), timestamp: new Date().toISOString() };
                        setLocalSubmissions(prev => [newEntry, ...prev]);
                        setToast({ message: "Data Disimpan (Mode Simulasi Lokal, belum masuk online)", type: "info" });
                    }
                    
                    setFormData({namaLengkap: '', tanggal: '', nama: '', kelas: '', kata1: '', kata2: '', kata3: '', suka: '', kekuatan: '', nyaman: '', harapan: '', tindakan: '', opsional: ''});
                } catch (error) {
                    console.error("Save error:", error);
                    setToast({ message: "Gagal menyimpan data. Pastikan koneksi internet stabil.", type: "error" });
                } finally {
                    setIsSubmitting(false);
                }
            };

            const inputClass = "w-full border-slate-200 rounded-xl focus:ring-brand-500 focus:border-brand-500 bg-slate-50 text-slate-800 p-3 mt-1";

            return (
                <Card>
                    <SectionHeader title="Lembar Kerja Murid" subtitle="Siswa mengisi form ini di akhir kegiatan." icon="fas fa-pen-to-square" />
                    {!isOnline && (
                        <div className="bg-yellow-50 text-yellow-800 p-3 rounded-lg text-sm mb-4 border border-yellow-200 font-medium">
                            <i className="fas fa-info-circle mr-2"></i> Aplikasi berjalan dalam Mode Simulasi (Data tidak tersimpan permanen).
                        </div>
                    )}
                    <form onSubmit={handleSubmit} className="space-y-6 mt-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label className="text-sm font-semibold text-slate-700">Nama Lengkap <span className="text-red-500">*</span></label>
                                <input type="text" name="namaLengkap" value={formData.namaLengkap} onChange={handleChange} className={inputClass} placeholder="Contoh: Budi Santoso" />
                            </div>
                            <div>
                                <label className="text-sm font-semibold text-slate-700">Tanggal Kegiatan <span className="text-red-500">*</span></label>
                                <input type="date" name="tanggal" value={formData.tanggal} onChange={handleChange} className={inputClass} />
                            </div>
                            <div>
                                <label className="text-sm font-semibold text-slate-700">Nama Panggilan <span className="text-red-500">*</span></label>
                                <input type="text" name="nama" value={formData.nama} onChange={handleChange} className={inputClass} placeholder="Contoh: Budi" />
                            </div>
                            <div>
                                <label className="text-sm font-semibold text-slate-700">Kelas Pilihan <span className="text-red-500">*</span></label>
                                <input type="text" name="kelas" value={formData.kelas} onChange={handleChange} className={inputClass} placeholder="Contoh: X IPA 1" />
                            </div>
                        </div>

                        <div>
                            <label className="text-sm font-semibold text-slate-700">1. Tiga kata yang menggambarkan diriku:</label>
                            <div className="grid grid-cols-3 gap-3">
                                <input type="text" name="kata1" value={formData.kata1} onChange={handleChange} className={inputClass} placeholder="Kata 1" />
                                <input type="text" name="kata2" value={formData.kata2} onChange={handleChange} className={inputClass} placeholder="Kata 2" />
                                <input type="text" name="kata3" value={formData.kata3} onChange={handleChange} className={inputClass} placeholder="Kata 3" />
                            </div>
                        </div>

                        {[
                            { id: "suka", label: "2. Satu hal yang kusukai atau membuatku bersemangat:" },
                            { id: "kekuatan", label: "3. Satu kekuatan atau kontribusi yang bisa kuberikan:" },
                            { id: "nyaman", label: "4. Aku merasa nyaman dalam kelompok ketika:" },
                            { id: "harapan", label: "5. Aku berharap kelompok ini:" },
                            { id: "tindakan", label: "6. Satu tindakan yang akan kulakukan untuk membangun kebersamaan:" }
                        ].map(field => (
                            <div key={field.id}>
                                <label className="text-sm font-semibold text-slate-700">{field.label}</label>
                                <input type="text" name={field.id} value={formData[field.id]} onChange={handleChange} className={inputClass} placeholder="..." />
                            </div>
                        ))}

                        <div>
                            <label className="text-sm font-semibold text-slate-700">7. Hal yang ingin kusampaikan secara pribadi kepada guru wali (opsional):</label>
                            <textarea name="opsional" value={formData.opsional} onChange={handleChange} rows="3" className={inputClass} placeholder="Tuliskan pesan rahasia di sini..."></textarea>
                        </div>

                        <div className="flex justify-end pt-4 border-t">
                            <Button type="submit" disabled={isSubmitting} icon={isSubmitting ? "fas fa-spinner fa-spin" : "fas fa-save"}>
                                {isSubmitting ? "Menyimpan..." : "Simpan Data"}
                            </Button>
                        </div>
                    </form>
                </Card>
            );
        };

        const RekapData = ({ localSubmissions, setToast }) => {
            const [submissions, setSubmissions] = useState([]);
            const [loading, setLoading] = useState(false);

            const fetchData = async () => {
                setLoading(true);
                try {
                    if (isOnline) {
                        // Harus mengizinkan CORS dan set Apps Script Access ke "Anyone"
                        const response = await fetch(GOOGLE_SCRIPT_URL);
                        if (!response.ok) throw new Error("Gagal memuat data dari server");
                        
                        const data = await response.json();
                        // Urutkan data berdasarkan timestamp terbaru
                        data.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                        setSubmissions(data);
                        setToast({ message: "Data berhasil diperbarui dari Server!", type: "success" });
                    } else {
                        // Ambil dari variabel simulasi lokal
                        setSubmissions(localSubmissions || []);
                    }
                } catch (error) {
                    console.error("Fetch error:", error);
                    setToast({ message: "Gagal menarik data. Pastikan Google Script di-deploy dengan akses 'Anyone'", type: "error" });
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
            }, [localSubmissions]);

            const handleDownloadCSV = () => {
                if (submissions.length === 0) return;
                const headers = ['Tanggal Submit', 'Tanggal Kegiatan', 'Nama Lengkap', 'Nama Panggilan', 'Kelas', '3 Kata Diri', 'Hal Disukai', 'Kekuatan', 'Nyaman Saat', 'Harapan', 'Tindakan', 'Pesan Opsional'];
                
                const rows = submissions.map(sub => {
                    const tigaKata = [sub.kata1, sub.kata2, sub.kata3].filter(Boolean).join(', ');
                    return [
                        new Date(sub.timestamp).toLocaleString('id-ID'),
                        sub.tanggal || '-', sub.namaLengkap || '-', sub.nama || '-', sub.kelas || '-',
                        tigaKata || '-', sub.suka || '-', sub.kekuatan || '-',
                        sub.nyaman || '-', sub.harapan || '-', sub.tindakan || '-', sub.opsional || '-'
                    ].map(val => `"${String(val).replace(/"/g, '""')}"`); // Format excel aman
                });

                const csvContent = [headers.join(','), ...rows.map(row => row.join(','))].join('\n');
                const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `Data_Puzzle_Kelas_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <Card>
                    <SectionHeader title="Rekap Lembar Kerja Siswa" subtitle="Lihat dan unduh jawaban yang telah diisi oleh murid." icon="fas fa-database" />
                    
                    {!isOnline && (
                        <div className="bg-yellow-50 text-yellow-800 p-4 rounded-xl mb-6 border border-yellow-200">
                            <h4 className="font-bold flex items-center"><i className="fas fa-exclamation-triangle mr-2 text-yellow-500"></i> Mode Simulasi Lokal (Belum Tersambung Server)</h4>
                            <p className="text-sm mt-1">Sistem saat ini belum terhubung ke Google Sheets. Masukkan <strong>URL Apps Script</strong> Anda di baris ke-69 pada kode HTML. Jika halaman ini di-refresh, data di bawah ini akan hilang!</p>
                        </div>
                    )}

                    {loading ? (
                        <div className="text-center py-10 text-slate-500">
                            <i className="fas fa-spinner fa-spin text-3xl mb-3 text-brand-500 block"></i> Menyinkronkan data...
                        </div>
                    ) : submissions.length === 0 ? (
                        <div className="text-center py-10 text-slate-500 bg-slate-50 rounded-xl border border-slate-200 relative">
                            {isOnline && (
                                <button onClick={fetchData} className="absolute top-4 right-4 text-brand-600 hover:text-brand-800 bg-brand-50 px-3 py-1 rounded-lg text-sm font-medium">
                                    <i className="fas fa-sync-alt mr-1"></i> Refresh
                                </button>
                            )}
                            <i className="fas fa-inbox text-3xl mb-3 text-slate-300 block mt-4"></i>
                            Belum ada data siswa yang masuk.
                        </div>
                    ) : (
                        <div className="space-y-4 mt-2">
                            <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-4 bg-slate-50 p-3 rounded-xl border border-slate-200">
                                <div className="flex gap-3 items-center">
                                    <div className="bg-brand-100 text-brand-800 px-3 py-1.5 rounded-lg text-sm font-bold shadow-sm">
                                        Total: {submissions.length} Siswa
                                    </div>
                                    <button onClick={fetchData} className="text-brand-600 hover:bg-brand-50 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors border border-transparent hover:border-brand-200 flex items-center gap-2">
                                        <i className="fas fa-sync-alt"></i> Refresh Data
                                    </button>
                                </div>
                                <Button onClick={handleDownloadCSV} icon="fas fa-file-excel" variant="outline" className="border-green-600 text-green-700 hover:bg-green-50 text-sm py-1.5">
                                    Download Excel (CSV)
                                </Button>
                            </div>
                            
                            {submissions.map((sub, idx) => (
                                <div key={sub.id || idx} className="p-4 border border-slate-200 rounded-xl bg-white shadow-sm hover:border-brand-300 transition-colors">
                                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-start mb-2 border-b border-slate-100 pb-2">
                                        <h4 className="font-bold text-slate-800 text-lg">
                                            {sub.namaLengkap || sub.nama} <span className="text-sm font-normal text-slate-600 bg-slate-100 px-2 py-1 rounded-md ml-2">{sub.kelas}</span>
                                        </h4>
                                        <div className="flex flex-col items-end text-xs text-slate-400 mt-1 sm:mt-0">
                                            {sub.tanggal && <span className="mb-1"><i className="fas fa-calendar-alt mr-1"></i>Kegiatan: {sub.tanggal}</span>}
                                            <span><i className="fas fa-clock mr-1"></i>Disubmit: {new Date(sub.timestamp).toLocaleString('id-ID')}</span>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-3 text-sm">
                                        <div><span className="font-semibold text-brand-600 block mb-1">Panggilan:</span> {sub.nama || '-'}</div>
                                        <div><span className="font-semibold text-brand-600 block mb-1">Kekuatan/Kontribusi:</span> {sub.kekuatan || '-'}</div>
                                        <div><span className="font-semibold text-brand-600 block mb-1">Harapan di Kelas:</span> {sub.harapan || '-'}</div>
                                        <div><span className="font-semibold text-brand-600 block mb-1">Tiga Kata Dirinya:</span> <span className="italic">{sub.kata1}, {sub.kata2}, {sub.kata3}</span></div>
                                        
                                        {sub.opsional && (
                                            <div className="col-span-1 md:col-span-2 bg-yellow-50 p-3 rounded-lg border border-yellow-200 mt-2">
                                                <span className="font-semibold text-yellow-800 block mb-1"><i className="fas fa-lock mr-1"></i>Pesan Pribadi:</span> 
                                                <span className="text-slate-800 italic">{sub.opsional}</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </Card>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('overview');
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [toast, setToast] = useState(null);
            const [localSubmissions, setLocalSubmissions] = useState([]);

            const navItems = [
                { id: 'overview', label: 'Ringkasan', icon: 'fa-home' },
                { id: 'materi', label: 'Materi & Naskah', icon: 'fa-book' },
                { id: 'aktivitas', label: 'Aktivitas & Refleksi', icon: 'fa-shapes' },
                { id: 'lembar', label: 'Lembar Kerja', icon: 'fa-pen-clip' },
                { id: 'rekap', label: 'Rekap Data Siswa', icon: 'fa-database' }
            ];

            const renderContent = () => {
                switch(activeTab) {
                    case 'overview': return <Overview />;
                    case 'materi': return <Materi />;
                    case 'aktivitas': return <Aktivitas />;
                    case 'lembar': return <LembarKerja setToast={setToast} setLocalSubmissions={setLocalSubmissions} />;
                    case 'rekap': return <RekapData localSubmissions={localSubmissions} setToast={setToast} />;
                    default: return <Overview />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-slate-50">
                    {/* Mobile Header */}
                    <div className="md:hidden bg-brand-700 text-white p-4 flex justify-between items-center shadow-md z-20 relative">
                        <div className="flex items-center gap-3 font-bold text-lg">
                            <img src="LOGO_SMA-removebg-preview.png" alt="Logo SMAN 1 Sleman" className="w-8 h-8 object-contain drop-shadow-md bg-white rounded-full p-0.5" />
                            <span>Puzzle Kelas</span>
                        </div>
                        <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="text-2xl p-1 focus:outline-none">
                            <i className={`fas ${isMobileMenuOpen ? 'fa-times' : 'fa-bars'}`}></i>
                        </button>
                    </div>

                    {/* Sidebar */}
                    <aside className={`
                        ${isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full'} 
                        md:translate-x-0 transition-transform duration-300 ease-in-out
                        fixed md:sticky top-0 left-0 h-screen w-64 bg-white border-r border-slate-200 shadow-xl md:shadow-none z-10 flex flex-col
                    `}>
                        <div className="p-5 border-b border-slate-100 hidden md:flex items-center gap-3">
                            <img src="LOGO_SMA-removebg-preview.png" alt="Logo SMAN 1 Sleman" className="w-12 h-12 object-contain drop-shadow-sm bg-white rounded-full p-1 border border-slate-100" />
                            <div>
                                <div className="text-brand-700 font-bold text-lg leading-tight">
                                    Guru Wali
                                </div>
                                <div className="text-xs text-slate-500 font-medium mt-1">SMAN 1 Sleman</div>
                            </div>
                        </div>

                        <nav className="flex-1 overflow-y-auto py-4">
                            <ul className="space-y-1 px-3">
                                {navItems.map(item => (
                                    <li key={item.id}>
                                        <button 
                                            onClick={() => { setActiveTab(item.id); setIsMobileMenuOpen(false); }}
                                            className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-sm font-medium ${
                                                activeTab === item.id 
                                                    ? 'bg-brand-50 text-brand-700' 
                                                    : 'text-slate-600 hover:bg-slate-50 hover:text-brand-600'
                                            }`}
                                        >
                                            <i className={`fas ${item.icon} w-5 text-center ${activeTab === item.id ? 'text-brand-600' : 'text-slate-400'}`}></i>
                                            {item.label}
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </nav>

                        <div className="p-4 border-t border-slate-100">
                            <div className="bg-brand-50 rounded-xl p-4 text-center">
                                <i className="fas fa-info-circle text-brand-500 text-2xl mb-2"></i>
                                <p className="text-xs text-brand-800 font-medium">Status: {isOnline ? "Online (Terkoneksi Server)" : "Offline (Simulasi Lokal)"}</p>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 p-4 md:p-8 overflow-y-auto relative w-full pb-20 md:pb-8">
                        <div className="max-w-4xl mx-auto">
                            {renderContent()}
                        </div>
                    </main>

                    {/* Notifikasi Pop-up */}
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
